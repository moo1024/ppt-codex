[project]
name = "ppt-master-v2"
version = "0.1.0"
description = "AI PPT 자동생성 파이프라인 (v7) — layout_spec을 python-pptx 네이티브 개체로 렌더"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "python-pptx>=1.0",
    "pillow>=10.0",
    "typer>=0.12",
    "fonttools>=4.50",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pptm = "pptm.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pptm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
